# Kernel virtual memory size

# CONFIG_KERNEL_VM_SIZE=0x4000000
# CONFIG_PARTIAL_DEVICE_TREE_SIZE=80000
# 
# CONFIG_SHELL_STACK_SIZE=8192
# 
# CONFIG_XEN_DOM0=y

CONFIG_XEN_DOM0=y

CONFIG_XSTAT=y
CONFIG_XSTAT_SHELL_CMDS=y

CONFIG_SHELL_STACK_SIZE=4096

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192

CONFIG_XEN_VCH=y
#CONFIG_XEN_DOM0LESS_BOOT=y

CONFIG_USE_DEFAULT_DOM_CFG=n
CONFIG_DOM_CFG_BUILTIN_IMAGES=n

CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_XRUN_STORAGE_DMA_DEBOUNCE=4

CONFIG_DOM_MAX=5
CONFIG_SHELL=y
CONFIG_DEBUG=y

CONFIG_NOCACHE_MEMORY=y
CONFIG_XEN_LIBFDT=y
CONFIG_PARTIAL_DEVICE_TREE_SIZE=1024000

